name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
      - claude/continuous-translation-app-lmjgpy
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # A custom environment name: the auto-created "github-pages" environment
    # restricts deployments to the default branch, which would block deploys
    # from the app's feature branch.
    environment:
      name: pages-live
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
